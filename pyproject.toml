[project]
name = "estios"
version = "0.1.0"
description = "Economic Spatial Temporal Input-Output Systems"
authors = [
    { name = "Dr Griffith Rees", email = "grees@turing.ac.uk" },
    { name = "Bowan Zhang", email = "bzhang@turing.ac.uk" },
    { name = "Dr Guy Solomon", email = "guy.solomon@glasgow.ac.uk" },
]
requires-python = ">=3.11,<3.12"
readme = "README.md"
license = "BSD-3-Clause"
maintainers = [{ name = "Dr Griffith Rees", email = "grees@turing.ac.uk" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
]
dependencies = [
    "geopandas>=0.13.2,<0.14",
    "plotly>=5.19.0,<6",
    "typer[all]>=0.4.2,<0.5",
    "openpyxl>=3.1.2,<4",
    "setuptools>=69.1.1,<70",
    "numpy>=1.26.4,<2",
    "xlrd>=2.0.1,<3",
    "Fiona>=1.9.5,<2",
    "pymrio>=0.4.8,<0.5",
    "country-converter>=1.2,<2",
    "poetry-dotenv-plugin>=0.1.0,<0.2",
    "ukcensusapi>=1.1.6,<2",
    "psutil==5.9.4",
]

[project.urls]
Homepage = "https://griff-rees.github.io/estios"
Repository = "https://github.com/griff-rees/estios"
Documentation = "https://griff-rees.github.io/estios"

[project.scripts]
estios = "estios.cli:app"

[project.optional-dependencies]
jupyter = ["jupyterlab>=4.1.3,<5"]
server = [
    "python-dotenv[cli]>=0.19.2,<0.20",
    "jupyter-dash>=0.4.2,<0.5",
    "fastapi>=0.70.1,<0.71",
    "uvicorn>=0.16.0,<0.17",
    "dash-auth>=1.4.1,<2",
]
dev = [
    "pytest-remotedata>=0.3.3,<0.4",
    "pytest>=7.4.3,<8",
    "pre-commit>=3.5.0,<4",
    "pytest-cov>=4.1.0,<5",
    "pytest-sugar>=0.9.7,<0.10",
    "mypy>=1.7.1,<2",
    "pytest-xdist>=3.5.0,<4",
    "pymrio>=0.4.8,<0.5",
    "filelock>=3.13.1,<4",
]
docs = [
    "mkdocs-material>=9.4.14,<10",
    "mkdocs-typer>=0.0.3,<0.0.4",
    "mkdocs-literate-nav>=0.6.1,<0.7",
    "mkdocs-gen-files>=0.5.0,<0.6",
    "mkdocs-section-index>=0.3.8,<0.4",
    "black>=23.11.0,<24",
    "pymdown-extensions>=10.5,<11",
    "mkdocs-bibtex>=2.11.0,<3",
    "mktestdocs>=0.2.1,<0.3",
    "markdown-exec[ansi]>=1.7.0,<2",
    "tabulate>=0.9.0,<0.10",
    "mkdocs-include-markdown-plugin>=6.0.4,<7",
    "mkdocstrings-python>=1.7.5,<2",
]

[tool.uv.build-backend]
module-root = ""

[build-system]
requires = ["uv_build>=0.9.26,<0.10.0"]
build-backend = "uv_build"

[tool.isort]
profile = "black"

[tool.pytest.ini_options]
addopts = """
--cov=estios
--cov-report=term:skip-covered
--cov-append
--pdbcls=IPython.terminal.debugger:TerminalPdb
--doctest-modules
--ignore=notebooks
--ignore-glob=*PRE_MERGE.py
--strict-config
--strict-markers
"""
# --dist=loadfile  # Ensure consisten test order per file
# -n 2
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "nomis: requires a nomis api key in .env to run",
]
remote_data_strict = true
xfail_strict = true
doctest_optionflags = ["NORMALIZE_WHITESPACE", "ELLIPSIS",]

# Pre-commit hooks related config.
[tool.pycln]
all = true

[tool.pydocstyle]
convention = "google"
match = '(?!test_).*\.py'
add-ignore = [
  "D100", "D101", "D102", "D104", "D105", "D106", "D107", "D203",
  "D204", "D211", "D213", "D301"
]
